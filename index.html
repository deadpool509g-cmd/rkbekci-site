<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medya Galerisi ve Görsel Portföyü</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="site-header">
        <div class="header-container">
            <h1 class="logo">Medya Portföyü</h1>
            <nav class="site-nav">
                <a href="#gallery" class="nav-link">Galeri</a>
                <a href="#about" class="nav-link">Hakkında</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="hero-section">
            <div class="hero-container">
                <h2>Görsel Varlıklar ve Ekran Görüntüleri</h2>
                <p>Haziran 2026 medya arşivinizden entegre edilmiş responsive görsel galerisi.</p>
            </div>
        </section>

        <section id="gallery" class="media-section">
            <div class="media-container">
                <div class="media-card">
                    <div class="image-wrapper">
                        <img src="media/2026/06/ekran-goruntusu-2026-06-08-215226-1.png" alt="Ekran Görüntüsü 2026-06-08" loading="lazy">
                    </div>
                    <div class="card-caption">
                        <h3>Ekran Görüntüsü 1</h3>
                        <p class="meta">Tarih: 8 Haziran 2026</p>
                    </div>
                </div>
                <div class="media-card">
                    <div class="image-wrapper">
                        <img src="media/2026/06/ekran-goruntusu-2026-05-17-132645.png" alt="Ekran Görüntüsü 2026-05-17" loading="lazy">
                    </div>
                    <div class="card-caption">
                        <h3>Ekran Görüntüsü 2</h3>
                        <p class="meta">Tarih: 17 Mayıs 2026</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="footer-container">
            <p>&copy; 2026 Medya Galerisi. Tüm hakları saklıdır.</p>
        </div>
    </footer>

</body>
</html>
